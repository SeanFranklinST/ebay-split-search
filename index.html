<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>eBay Barcode Split Search</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f3f3f3;
      text-align: center;
      padding: 40px;
    }

    .box {
      background: white;
      max-width: 850px;
      margin: auto;
      padding: 30px;
      border-radius: 14px;
      box-shadow: 0 3px 12px rgba(0,0,0,.15);
    }

    #mainSearch {
      width: 90%;
      font-size: 30px;
      padding: 18px;
      text-align: center;
      border: 3px solid #222;
      border-radius: 12px;
    }

    button {
      font-size: 18px;
      padding: 13px 20px;
      margin: 8px;
      border: none;
      border-radius: 8px;
      background: #222;
      color: white;
      cursor: pointer;
    }

    .small input {
      width: 320px;
      padding: 12px;
      font-size: 16px;
      margin-top: 15px;
    }

    .status {
      margin-top: 15px;
      color: #555;
    }
  </style>
</head>

<body>

<div class="box">

  <h1>eBay Split Search</h1>

  <input
    id="mainSearch"
    placeholder="Scan barcode / ISBN / UPC / title"
    autofocus
    autocomplete="off"
  >

  <br>

  <button onclick="searchBoth()">Search Both</button>
  <button onclick="launchWindows()">Launch / Reset Windows</button>
  <button onclick="clearSearch()">Clear</button>

  <div class="small">
    <input id="liveRefine" placeholder="Refine live listings only">
    <button onclick="searchLiveOnly()">Live Only</button>
  </div>

  <div class="small">
    <input id="soldRefine" placeholder="Refine sold listings only">
    <button onclick="searchSoldOnly()">Sold Only</button>
  </div>

  <div class="status" id="status">
    Ready. Click "Launch / Reset Windows" first.
  </div>

</div>

<script>

let liveWindow = null;
let soldWindow = null;
let scanTimer = null;
let lastSearch = "";

const mainSearch = document.getElementById("mainSearch");
const liveRefine = document.getElementById("liveRefine");
const soldRefine = document.getElementById("soldRefine");
const statusBox = document.getElementById("status");

function ebayLive(q) {
  return "https://www.ebay.com/sch/i.html?_nkw=" + encodeURIComponent(q);
}

function ebaySold(q) {
  return "https://www.ebay.com/sch/i.html?_nkw=" + encodeURIComponent(q) + "&LH_Sold=1&LH_Complete=1";
}

function launchWindows() {

  const half = Math.floor(screen.availWidth / 2);

  liveWindow = window.open(
    "about:blank",
    "EBAY_LIVE_WINDOW",
    `width=${half},height=${screen.availHeight},left=0,top=0,resizable=yes,scrollbars=yes`
  );

  soldWindow = window.open(
    "about:blank",
    "EBAY_SOLD_WINDOW",
    `width=${half},height=${screen.availHeight},left=${half},top=0,resizable=yes,scrollbars=yes`
  );

  if (liveWindow) liveWindow.opener = null;
  if (soldWindow) soldWindow.opener = null;

  statusBox.textContent = "Windows launched. Ready for search.";

  refocusMain();
}

function makeSureWindowsExist() {

  if (
    !liveWindow ||
    liveWindow.closed ||
    !soldWindow ||
    soldWindow.closed
  ) {
    launchWindows();
  }
}

function searchBoth() {

  const q = mainSearch.value.trim();

  if (!q) return;

  makeSureWindowsExist();

  lastSearch = q;

  liveWindow.location.href = ebayLive(q);
  soldWindow.location.href = ebaySold(q);

  liveRefine.value = q;
  soldRefine.value = q;

  statusBox.textContent = "Searching both: " + q;

  refocusMain();
}

function searchLiveOnly() {

  const q = liveRefine.value.trim();

  if (!q) return;

  makeSureWindowsExist();

  liveWindow.location.href = ebayLive(q);

  statusBox.textContent = "Live updated: " + q;

  refocusMain();
}

function searchSoldOnly() {

  const q = soldRefine.value.trim();

  if (!q) return;

  makeSureWindowsExist();

  soldWindow.location.href = ebaySold(q);

  statusBox.textContent = "Sold updated: " + q;

  refocusMain();
}

function clearSearch() {

  mainSearch.value = "";
  liveRefine.value = "";
  soldRefine.value = "";

  statusBox.textContent = "Cleared. Ready for next scan.";

  refocusMain();
}

function refocusMain() {

  setTimeout(() => {
    window.focus();
    mainSearch.focus();
    mainSearch.select();
  }, 300);
}

mainSearch.addEventListener("input", () => {

  clearTimeout(scanTimer);

  const q = mainSearch.value.trim();

  // Instant search for likely barcode scans: ISBN-10, ISBN-13, UPC, EAN
  if (/^\d{10,14}$/.test(q) && q !== lastSearch) {
    searchBoth();
    return;
  }

  // Typed searches wait 3 seconds after you stop typing
  scanTimer = setTimeout(() => {

    const typedQuery = mainSearch.value.trim();

    if (typedQuery.length >= 10 && typedQuery !== lastSearch) {
      searchBoth();
    }

  }, 3000);

});

mainSearch.addEventListener("keydown", e => {

  if (e.key === "Enter") {

    e.preventDefault();

    searchBoth();
  }
});

liveRefine.addEventListener("keydown", e => {

  if (e.key === "Enter") {

    e.preventDefault();

    searchLiveOnly();
  }
});

soldRefine.addEventListener("keydown", e => {

  if (e.key === "Enter") {

    e.preventDefault();

    searchSoldOnly();
  }
});

setInterval(() => {

  if (
    document.activeElement !== liveRefine &&
    document.activeElement !== soldRefine
  ) {
    mainSearch.focus();
  }

}, 1000);

window.onload = refocusMain;

</script>

</body>
</html>
