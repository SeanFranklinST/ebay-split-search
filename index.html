<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>eBay Barcode Split Search</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f3f3f3;
      text-align: center;
      padding: 40px;
    }

    .box {
      background: white;
      max-width: 850px;
      margin: auto;
      padding: 30px;
      border-radius: 14px;
      box-shadow: 0 3px 12px rgba(0,0,0,.15);
    }

    #mainSearch {
      width: 90%;
      font-size: 30px;
      padding: 18px;
      text-align: center;
      border: 3px solid #222;
      border-radius: 12px;
    }

    button {
      font-size: 18px;
      padding: 13px 20px;
      margin: 8px;
      border: none;
      border-radius: 8px;
      background: #222;
      color: white;
      cursor: pointer;
    }

    .small input {
      width: 320px;
      padding: 12px;
      font-size: 16px;
      margin-top: 15px;
    }

    .status {
      margin-top: 15px;
      color: #555;
      font-weight: bold;
    }
  </style>
</head>

<body>

<div class="box">
  <h1>eBay Split Search</h1>

  <input
    id="mainSearch"
    placeholder="Scan barcode / ISBN / UPC / title"
    autofocus
    autocomplete="off"
  >

  <br>

  <button onclick="launchWindows()">Launch / Reset Windows</button>
  <button onclick="searchBoth()">Search Both</button>
  <button onclick="clearSearch()">Clear</button>

  <div class="small">
    <input id="liveRefine" placeholder="Refine live listings only">
    <button onclick="searchLiveOnly()">Live Only</button>
  </div>

  <div class="small">
    <input id="soldRefine" placeholder="Refine sold listings only">
    <button onclick="searchSoldOnly()">Sold Only</button>
  </div>

  <div class="status" id="status">
    Step 1: Click “Launch / Reset Windows” first.
  </div>
</div>

<script>
let liveWindow = null;
let soldWindow = null;
let scanTimer = null;
let lastSearch = "";
let scanStartTime = 0;
let lastInputTime = 0;

const mainSearch = document.getElementById("mainSearch");
const liveRefine = document.getElementById("liveRefine");
const soldRefine = document.getElementById("soldRefine");
const statusBox = document.getElementById("status");

function ebayLive(q) {
  return "https://www.ebay.com/sch/i.html?_nkw=" + encodeURIComponent(q);
}

function ebaySold(q) {
  return "https://www.ebay.com/sch/i.html?_nkw=" + encodeURIComponent(q) + "&LH_Sold=1&LH_Complete=1";
}

function launchWindows() {
  const half = Math.floor(screen.availWidth / 2);

  liveWindow = window.open(
    "about:blank",
    "EBAY_LIVE_WINDOW",
    `width=${half},height=${screen.availHeight},left=0,top=0,resizable=yes,scrollbars=yes`
  );

  soldWindow = window.open(
    "about:blank",
    "EBAY_SOLD_WINDOW",
    `width=${half},height=${screen.availHeight},left=${half},top=0,resizable=yes,scrollbars=yes`
  );

  if (!liveWindow || !soldWindow) {
    statusBox.textContent = "Popup blocked. Allow popups for this site, then click Launch again.";
    return;
  }

  statusBox.textContent = "Windows launched. Return here and scan/type your search.";
  refocusMain();
}

function windowsReady() {
  if (!liveWindow || liveWindow.closed || !soldWindow || soldWindow.closed) {
    statusBox.textContent = "Click Launch / Reset Windows first, then search again.";
    return false;
  }

  return true;
}

function searchBoth() {
  const q = mainSearch.value.trim();

  if (!q) return;
  if (!windowsReady()) return;

  lastSearch = q;

  liveWindow.location.href = ebayLive(q);
  soldWindow.location.href = ebaySold(q);

  liveRefine.value = q;
  soldRefine.value = q;

  mainSearch.value = "";

  scanStartTime = 0;
  lastInputTime = 0;

  statusBox.textContent = "Updated both windows: " + q;

  refocusMain();
}

function searchLiveOnly() {
  const q = liveRefine.value.trim();

  if (!q) return;
  if (!windowsReady()) return;

  liveWindow.location.href = ebayLive(q);

  statusBox.textContent = "Updated live window: " + q;

  refocusMain();
}

function searchSoldOnly() {
  const q = soldRefine.value.trim();

  if (!q) return;
  if (!windowsReady()) return;

  soldWindow.location.href = ebaySold(q);

  statusBox.textContent = "Updated sold window: " + q;

  refocusMain();
}

function clearSearch() {
  mainSearch.value = "";
  liveRefine.value = "";
  soldRefine.value = "";

  lastSearch = "";
  scanStartTime = 0;
  lastInputTime = 0;

  statusBox.textContent = "Cleared. Ready for next search.";

  refocusMain();
}

function refocusMain() {
  setTimeout(() => {
    window.focus();
    mainSearch.focus();
  }, 300);
}

mainSearch.addEventListener("input", () => {
  clearTimeout(scanTimer);

  const q = mainSearch.value.trim();
  const now = Date.now();

  if (q.length === 1) {
    scanStartTime = now;
  }

  const totalInputTime = now - scanStartTime;
  const timeSinceLastInput = lastInputTime ? now - lastInputTime : 9999;

  lastInputTime = now;

  const likelyBarcodeScan =
    /^\d{10,14}$/.test(q) &&
    totalInputTime > 0 &&
    totalInputTime < 700 &&
    timeSinceLastInput < 100;

  if (likelyBarcodeScan && q !== lastSearch) {
    searchBoth();
    return;
  }

  scanTimer = setTimeout(() => {
    const typedQuery = mainSearch.value.trim();

    if (typedQuery.length >= 3 && typedQuery !== lastSearch) {
      searchBoth();
    }
  }, 3000);
});

mainSearch.addEventListener("keydown", e => {
  if (e.key === "Enter") {
    e.preventDefault();
  }
});

liveRefine.addEventListener("keydown", e => {
  if (e.key === "Enter") {
    e.preventDefault();
    searchLiveOnly();
  }
});

soldRefine.addEventListener("keydown", e => {
  if (e.key === "Enter") {
    e.preventDefault();
    searchSoldOnly();
  }
});

setInterval(() => {
  if (
    document.activeElement !== liveRefine &&
    document.activeElement !== soldRefine
  ) {
    mainSearch.focus();
  }
}, 1000);

window.onload = refocusMain;
</script>

</body>
</html>
